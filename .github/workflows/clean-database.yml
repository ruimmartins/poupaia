name: Clean Database

on:
  schedule:
    # Corre 3 vezes por dia: 00:00, 08:00, 16:00 UTC
    - cron: '0 0,8,16 * * *'
  workflow_dispatch: # Permite executar manualmente

jobs:
  clean-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run clean-database
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_PRODUCTS_DB_NAME: ${{ secrets.MONGODB_PRODUCTS_DB_NAME }}
        run: pnpm --filter tasks clean-database
