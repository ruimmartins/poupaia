name: Maintain Database

on:
  schedule:
    - cron: '0 0 * * *'  # Às 16h UTC (17h PT)
    - cron: '0 6 * * *'   # Às 5h UTC (6h PT)
    - cron: '0 12 * * *'  # Às 9h UTC (10h PT)
    - cron: '0 18 * * *'   # Às 12h UTC (13h PT)
  workflow_dispatch:

jobs:
  maintain-database:
    runs-on: ubuntu-latest

    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_PRODUCTS_DB_NAME: ${{ secrets.MONGODB_PRODUCTS_DB_NAME }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Cache dependências pnpm
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Executar manutenção do banco de dados
        run: pnpm run maintain-database
