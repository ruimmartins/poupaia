name: Deploy to Google Cloud

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west1
  GAR_LOCATION: europe-west1
  REPOSITORY: poupaia-repo

jobs:
  deploy-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token' # Gera token para o Docker
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # Autentica no Docker usando o token gerado acima (mais rápido que gcloud configure-docker)
      - name: Docker Auth
        uses: 'docker/login-action@v3'
        with:
          registry: '${{ env.GAR_LOCATION }}-docker.pkg.dev'
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push API
        uses: 'docker/build-push-action@v5'
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }}
          cache-from: type=gha # Usa o cache nativo do GitHub Actions
          cache-to: type=gha,mode=max

      - name: Deploy API Service
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: poupaia-bot
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }}
          region: ${{ env.REGION }}
          env_vars: |
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            MONGODB_PRODUCTS_DB_NAME=${{ secrets.MONGODB_PRODUCTS_DB_NAME }}
